name: Attendance Monitor

on:
  schedule:
    # 6:00 PM Asia/Kolkata is 12:30 PM UTC.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: attendance_bot

    env:
      ERP_URL: https://erp.lbrce.ac.in/
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
      HEADLESS: "true"
      ATTENDANCE_THRESHOLD: "75"
      NOTIFIER_METHOD: telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run attendance check
        run: python main.py --check-now

      - name: Persist attendance history and reports
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance_bot/attendance_history.json attendance_bot/reports
          if git diff --cached --quiet; then
            echo "No attendance artifacts changed."
          else
            git commit -m "Update attendance report"
            git push
          fi

      - name: Upload debug logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-debug-artifacts
          path: |
            attendance_bot/logs
            attendance_bot/screenshots
          if-no-files-found: ignore
